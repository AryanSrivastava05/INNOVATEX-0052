services:
  - type: web
    name: pulsecare-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TICK_SECONDS
        value: 5
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEMO_TOKEN
        generateValue: true
